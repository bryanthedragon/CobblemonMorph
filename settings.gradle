pluginManagement 
{
    repositories 
    {
        gradlePluginPortal()
        maven 
        {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven 
        {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org' 
        }
        maven
        {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/'
        }
        mavenCentral()
    }
}

plugins 
{
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}