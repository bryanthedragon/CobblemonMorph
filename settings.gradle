pluginManagement 
{
    repositories 
    {
        gradlePluginPortal()
        maven 
        {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven 
        {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org' 
        }
        maven 
        {
            name = 'TocraftMavenPublic'
            url = 'https://maven.tocraft.dev/public'
        }
        maven 
        {
            name = 'TerraformersMaven'
            url = 'https://maven.terraformersmc.com/'
        }
        maven 
        {
            name = 'ShedanielMaven'
            url = 'https://maven.shedaniel.me/'
        }
        maven 
        {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/maven'
        }
        mavenCentral()
    }

    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "net.minecraftforge.gradle") {
                useModule("net.minecraftforge.gradle:ForgeGradle:${requested.version}")
            }
            if (requested.id.id == "org.parchmentmc.librarian.forgegradle") {
                useModule("org.parchmentmc:librarian:${requested.version}")
            }
            if (requested.id.id == "tocraft.craftedcore") {
                useModule("tocraft:craftedcore:${requested.version}")
            }
            if (requested.id.id == "terraformersmc.modutils") {
                useModule("terraformersmc:modutils:${requested.version}")
            }
            if (requested.id.id == "spongepowered.mixin") {
                useModule("spongepowered:mixin:${requested.version}")
            }
        }
    }
}

// Intentionally avoid the Foojay resolver plugin here so the build does not depend
// on plugin-portal/network access just to configure toolchains.
