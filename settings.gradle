pluginManagement 
{
    repositories 
    {
        gradlePluginPortal()
        maven 
        {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven 
        {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org' 
        }
        mavenCentral()
    }
}

// Intentionally avoid the Foojay resolver plugin here so the build does not depend
// on plugin-portal/network access just to configure toolchains.
